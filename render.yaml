services:
  - type: web
    name: smartcart-ai-backend
    env: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /tmp/smartcart.db
      - key: JWT_SECRET
        generateValue: true
